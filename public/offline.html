<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fără conexiune — Coridor</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f7f7;
        color: #1c262b;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.55;
      }
      main { max-width: 32rem; text-align: center; }
      h1 { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 300; margin: 0 0 12px; }
      p { margin: 0 0 20px; color: #5a6a72; }
      button {
        border: 1px solid #1c262b;
        background: #1c262b;
        color: #f6f7f7;
        border-radius: 999px;
        padding: 12px 24px;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nu ai conexiune</h1>
      <p>
        Pagina nu s-a putut încărca. Cererile și traseele se încarcă atunci când
        revine conexiunea — nu ținem date private în memoria telefonului.
      </p>
      <button type="button" onclick="location.reload()">Încearcă din nou</button>
    </main>
  </body>
</html>
