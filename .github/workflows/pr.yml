name: Pull request

# Everything a change has to survive before it can be merged into main,
# plus a preview deployment so the change can be looked at rather than
# imagined.
#
# Nothing here touches the production database. Migrations run against a
# throwaway Postgres; only the main pipeline talks to the real project.
#
# The preview itself is built by Vercel's Git integration, which builds
# every branch except `main`. The preview job waits for that build, checks
# it answers and posts its URL. Required repository secret:
#   VERCEL_AUTOMATION_BYPASS_SECRET  Vercel → project transport → Settings →
#                                    Deployment Protection → Protection
#                                    Bypass for Automation

on:
  pull_request:
  workflow_dispatch:

# One run per pull request. A new push supersedes the previous run, which is
# safe here because nothing in this file deploys to production.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  database:
    name: Migrations, business rules and RLS
    runs-on: ubuntu-latest
    # The business rules live in Postgres, not in the frontend, so a
    # migration that breaks one has to fail here and not in review.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Every migration, then the smoke and RLS suites
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/db-test.sh

  functions:
    name: Edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The package scripts, not a second spelling of them: CI has to run
      # what a developer runs, or the two drift and only CI notices.
      - run: pnpm check:functions
      - run: pnpm test:functions

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  anaf:
    name: Company lookup (ANAF), live
    runs-on: ubuntu-latest
    # A report, not a gate: ANAF rate-limits and goes down, and neither is
    # a reason to block a merge. What it answers is whether the sign-up's
    # CUI autofill can work at all — ANAF from here, the function on the
    # project, its secrets (names only), a real lookup through it. Every
    # call only reads: no company id is sent, so nothing is written.
    continue-on-error: true
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Walk the lookup and report
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: bash scripts/ci/check-anaf.sh

  preview:
    name: Vercel preview
    runs-on: ubuntu-latest
    needs: [checks, database, functions, e2e]
    # A fork's pull request cannot read secrets. Skipping is right here:
    # Vercel does not build forks without approval, and failing would say
    # nothing useful.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.wait.outputs.url }}
    env:
      # Vercel builds the branch head, not the merge commit in github.sha.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Require the Vercel secret
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bash scripts/ci/require-secrets.sh VERCEL_AUTOMATION_BYPASS_SECRET

      - name: Wait for Vercel's build of this commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url=$(bash scripts/ci/wait-for-preview.sh "$HEAD_SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the preview answers
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bash scripts/ci/smoke-deployment.sh "${{ steps.wait.outputs.url }}"

      - name: Post the URL on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.wait.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- preview-deployment -->';
            const body = [
              marker,
              '**Preview**: ' + url,
              '',
              '| | |',
              '|---|---|',
              '| Commit | `' + process.env.HEAD_SHA.slice(0, 7) + '` |',
              '| Homepage | ' + url + ' |',
              '| Autentificare | ' + url + '/autentificare |',
              '',
              '_Preview only, behind Vercel login. The production database is ' +
                'untouched by this run — migrations are applied by the main pipeline after merge._',
            ].join('\n');

            // Update the previous comment rather than adding one per push,
            // so a long-running pull request does not grow a wall of them.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
