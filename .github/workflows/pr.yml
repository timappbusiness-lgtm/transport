name: Pull request

# Everything a change has to survive before it can be merged into main,
# plus a preview deployment so the change can be looked at rather than
# imagined.
#
# Nothing here touches the production database. Migrations run against a
# throwaway Postgres; only the main pipeline talks to the real project.
#
# Required repository secrets for the preview step:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

on:
  pull_request:
  workflow_dispatch:

# One run per pull request. A new push supersedes the previous run, which is
# safe here because nothing in this file deploys to production.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  database:
    name: Migrations, business rules and RLS
    runs-on: ubuntu-latest
    # The business rules live in Postgres, not in the frontend, so a
    # migration that breaks one has to fail here and not in review.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Every migration, then the smoke and RLS suites
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/db-test.sh

  functions:
    name: Edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The package scripts, not a second spelling of them: CI has to run
      # what a developer runs, or the two drift and only CI notices.
      - run: pnpm check:functions
      - run: pnpm test:functions

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  preview:
    name: Vercel preview
    runs-on: ubuntu-latest
    needs: [checks, database, functions, e2e]
    # A fork's pull request cannot read secrets. Skipping is right here:
    # there is nothing to deploy to, and failing would say nothing useful.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Require the Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: bash scripts/ci/require-secrets.sh VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID

      - name: Install the Vercel CLI
        run: pnpm add -g vercel@59

      - name: Build and deploy a preview
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          # The CLI writes progress to stderr and the URL to stdout.
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the preview answers
        run: bash scripts/ci/smoke-deployment.sh "${{ steps.deploy.outputs.url }}"

      - name: Post the URL on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- coridor-preview -->';
            const body = [
              marker,
              '**Preview**: ' + url,
              '',
              '| | |',
              '|---|---|',
              '| Commit | `' + context.sha.slice(0, 7) + '` |',
              '| Homepage | ' + url + ' |',
              '| Autentificare | ' + url + '/autentificare |',
              '',
              '_Preview only. The production database is untouched by this run — ' +
                'migrations are applied by the main pipeline after merge._',
            ].join('\n');

            // Update the previous comment rather than adding one per push,
            // so a long-running pull request does not grow a wall of them.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
