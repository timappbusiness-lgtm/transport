name: Main

# The release pipeline. This is the only place that writes to the production
# database or to Vercel production — no session, no laptop, no
# other workflow.
#
# It runs strictly in order and stops at the first failure:
#
#   1. checks      typecheck, lint, unit, db:test, edge functions, e2e
#   2. migrations  supabase db push --dry-run, then the real push
#   3. functions   deploy the edge functions whose sources changed
#   4. production  Vercel production deploy, through a deploy hook
#   5. advisors    security advisors, written into the run summary
#
# Steps 2 and 3 change a system that has no undo, so nothing is allowed to
# cancel a run in flight: see the concurrency block below.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN   a personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF    ytwzydilyiekhexnpziu
#   SUPABASE_DB_PASSWORD    the database password for that project
#   VERCEL_DEPLOY_HOOK_URL  Vercel → project transport → Settings → Git →
#                           Deploy Hooks, a hook on branch `main`

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PRODUCTION_URL: https://transport-seven-sandy.vercel.app

# One release at a time. `cancel-in-progress: false` is deliberate: a run
# that is halfway through `supabase db push` must be allowed to finish.
# Cancelling it would leave the project's migration history disagreeing with
# the repository, which is exactly the state this pipeline exists to prevent.
concurrency:
  group: main-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: 1. Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Migrations, business rules and RLS
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/db-test.sh

      - name: Edge functions
        run: |
          pnpm check:functions
          pnpm test:functions

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

  migrations:
    name: 2. Database migrations
    runs-on: ubuntu-latest
    needs: checks
    outputs:
      applied: ${{ steps.push.outputs.applied }}
    steps:
      - uses: actions/checkout@v4

      - name: Require the Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash scripts/ci/require-secrets.sh SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: What the remote already has
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          {
            echo '## Migrations'
            echo
            echo '### Local vs remote, before the push'
            echo
            echo '```'
            supabase migration list --linked 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run 2>&1 | tee dry-run.txt
          {
            echo
            echo '### Dry run'
            echo
            echo '```'
            cat dry-run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push
        id: push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase db push --linked 2>&1 | tee push.txt
          echo "applied=$(grep -c 'Applying migration' push.txt || true)" >> "$GITHUB_OUTPUT"
          {
            echo
            echo '### Push'
            echo
            echo '```'
            cat push.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  functions:
    name: 3. Edge functions
    runs-on: ubuntu-latest
    needs: migrations
    steps:
      - uses: actions/checkout@v4
        with:
          # The previous commit is needed to see which functions changed.
          fetch-depth: 2

      - name: Require the Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: bash scripts/ci/require-secrets.sh SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Deploy the functions whose sources changed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/ci/deploy-functions.sh

  production:
    name: 4. Vercel production
    runs-on: ubuntu-latest
    needs: functions
    # vercel.json stops Vercel deploying `main` on push, so production only
    # changes here, after the migrations and functions above are in. The
    # build itself runs on Vercel; this job starts it through a deploy hook
    # and waits for production to report this commit.
    environment:
      name: production
      url: https://transport-seven-sandy.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Require the Vercel secret
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: bash scripts/ci/require-secrets.sh VERCEL_DEPLOY_HOOK_URL

      - name: Deploy and wait for this commit
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: bash scripts/ci/release-production.sh "$PRODUCTION_URL" "$GITHUB_SHA"

      - name: Check production answers
        run: bash scripts/ci/smoke-deployment.sh "$PRODUCTION_URL"

  advisors:
    name: 5. Security advisors
    runs-on: ubuntu-latest
    needs: production
    steps:
      - uses: actions/checkout@v4

      - name: Require the Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash scripts/ci/require-secrets.sh SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Report
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash scripts/ci/advisors-report.sh
