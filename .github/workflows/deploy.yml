name: Verify and deploy

# Deploys to Vercel from GitHub's runners rather than from someone's laptop.
#
# A push to the default branch goes to production; a pull request gets its
# own preview URL. Nothing deploys until the checks pass: an auto-deploy
# that skips them just ships breakage faster.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       a token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID      `orgId` from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID  `projectId` from the same file
#
# Application environment variables are NOT duplicated here. `vercel pull`
# fetches them from the Vercel project, so Vercel stays the one place they
# are set.

on:
  push:
    branches: [claude/saas-transport-exchange-w6f92q]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first: cancel the run it replaces.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  database:
    name: Migrations, business rules and RLS
    runs-on: ubuntu-latest
    # The rules this project relies on live in Postgres, not in the frontend,
    # so a migration that breaks them has to fail here rather than in review.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Run every migration, then the smoke and RLS suites
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/db-test.sh

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [verify, database]
    # A fork's pull request cannot read secrets, so the deploy would fail on
    # `vercel pull` with a confusing error. Skip it instead.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    environment:
      name: ${{ github.ref_name == 'claude/saas-transport-exchange-w6f92q' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The `secrets` context is not readable in a job-level `if`, so the
      # check is a step. Without it the first run after adding this file
      # fails on `vercel pull` with an opaque error instead of saying what
      # is missing.
      - name: Check the Vercel secrets are set
        id: guard
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$ORG" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$PROJECT" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Deploy skipped"
              echo
              echo "Missing repository secrets:$missing"
              echo
              echo "Add them under Settings -> Secrets and variables -> Actions."
              echo "\`VERCEL_ORG_ID\` and \`VERCEL_PROJECT_ID\` are the \`orgId\` and"
              echo "\`projectId\` in \`.vercel/project.json\` after running \`vercel link\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Vercel CLI
        if: steps.guard.outputs.configured == 'true'
        run: pnpm add -g vercel@59

      # Production on the default branch, preview everywhere else. The three
      # steps below only differ by this flag, so it is computed once.
      - name: Choose the target environment
        id: target
        if: steps.guard.outputs.configured == 'true'
        run: |
          if [ "${{ github.ref_name }}" = "claude/saas-transport-exchange-w6f92q" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull the project settings and environment variables
        if: steps.guard.outputs.configured == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=${{ steps.target.outputs.environment }} --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        if: steps.guard.outputs.configured == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build ${{ steps.target.outputs.flag }} --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        id: deploy
        if: steps.guard.outputs.configured == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # The CLI writes progress to stderr and the deployment URL to
          # stdout; take the last line in case anything else slips through.
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token="${{ secrets.VERCEL_TOKEN }}" | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the deployment answers
        if: steps.guard.outputs.configured == 'true'
        run: |
          for path in / /autentificare; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.url }}$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
